name: Attendance AI Image Post

on:
  push:
    branches: [main]
    paths:
      - ".github/attendance-ai-post-trigger.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: attendance-ai-image-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run publication control tests
        run: node --test test/attendance-publication-control.test.mjs

      - name: Post untouched direct ChatGPT Image output to Teams
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: node scripts/post-external-image-to-teams.mjs
