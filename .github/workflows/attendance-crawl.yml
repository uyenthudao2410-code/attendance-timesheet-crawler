name: Attendance Crawl

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Vietnam attendance date (YYYY-MM-DD); blank = today"
        required: false
        type: string
      debug:
        description: "Capture raw text/screenshots inside the encrypted artifact"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/attendance-rerun-trigger.json"
  schedule:
    # GitHub cron is UTC; Vietnam is UTC+7 year-round.
    # Queue early to absorb scheduler delay, then capture inside the business snapshot window.
    - cron: "20 6 * * *"   # 13:20 VN queue -> snapshot >=13:35 -> 13:50 morning report
    - cron: "20 0 * * *"   # 07:20 VN queue -> snapshot >=07:35 -> 07:50 previous-day final report

permissions:
  contents: write

concurrency:
  group: attendance-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve attendance target date
        shell: bash
        env:
          MANUAL_TARGET_DATE: ${{ github.event.inputs.target_date }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TARGET_DATE:-}" ]; then
            target_date="$MANUAL_TARGET_DATE"
            run_slot="manual"
          elif [ "${EVENT_NAME:-}" = "push" ]; then
            test -f .github/attendance-rerun-trigger.json || { echo "Missing rerun trigger" >&2; exit 1; }
            target_date="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.target_date||''));")"
            run_slot="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.slot||''));")"
            case "$run_slot" in
              morning_1230|daily_2105) ;;
              *) echo "Invalid rerun slot" >&2; exit 1 ;;
            esac
          else
            case "${SCHEDULE_EXPRESSION:-}" in
              "20 6 * * *")
                target_date="$(TZ=Asia/Ho_Chi_Minh date +%F)"
                run_slot="morning_1230"
                ;;
              "20 0 * * *")
                target_date="$(TZ=Asia/Ho_Chi_Minh date -d 'yesterday' +%F)"
                run_slot="daily_2105"
                ;;
              *)
                echo "Unknown scheduled expression: ${SCHEDULE_EXPRESSION:-}" >&2
                exit 1
                ;;
            esac
          fi
          if ! [[ "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid resolved target date" >&2
            exit 1
          fi
          echo "TARGET_DATE=$target_date" >> "$GITHUB_ENV"
          echo "ATTENDANCE_RUN_SLOT=$run_slot" >> "$GITHUB_ENV"
          echo "Attendance run slot=$run_slot target_date=$target_date event=${EVENT_NAME:-unknown}"

      - name: Wait until business snapshot time
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ATTENDANCE_RUN_SLOT" in
            morning_1230)
              snapshot_date="$TARGET_DATE"
              snapshot_time="13:35:00"
              ;;
            daily_2105)
              snapshot_date="$(TZ=Asia/Ho_Chi_Minh date +%F)"
              snapshot_time="07:35:00"
              ;;
            *)
              echo "No wait target for slot=$ATTENDANCE_RUN_SLOT"
              exit 0
              ;;
          esac
          target_epoch="$(TZ=Asia/Ho_Chi_Minh date -d "${snapshot_date} ${snapshot_time}" +%s)"
          now_epoch="$(TZ=Asia/Ho_Chi_Minh date +%s)"
          if [ "$now_epoch" -lt "$target_epoch" ]; then
            wait_seconds=$((target_epoch - now_epoch))
            echo "Queued early for slot=$ATTENDANCE_RUN_SLOT; waiting ${wait_seconds}s until ${snapshot_date} ${snapshot_time}."
            sleep "$wait_seconds"
          else
            echo "Scheduler started at/after snapshot window; proceeding immediately."
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run parser and report tests
        run: npm test

      - name: Validate private configuration
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATTENDANCE_ROSTER_JSON" || { echo "Missing required repository secret: ATTENDANCE_ROSTER_JSON"; exit 1; }
          roster_fingerprint="$(node scripts/derive-artifact-material.mjs fingerprint)"
          identity_fingerprint="$(node scripts/derive-artifact-material.mjs identity-fingerprint)"
          test "${#roster_fingerprint}" -eq 64 || { echo "Invalid roster fingerprint"; exit 1; }
          test "${#identity_fingerprint}" -eq 64 || { echo "Invalid identity fingerprint"; exit 1; }
          echo "ATTENDANCE_ROSTER_FINGERPRINT=$roster_fingerprint" >> "$GITHUB_ENV"
          echo "ATTENDANCE_IDENTITY_FINGERPRINT=$identity_fingerprint" >> "$GITHUB_ENV"

      - name: Check whether browser fallback is required
        id: browser_preflight
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/browser-fallback-preflight.mjs

      - name: Install Chromium only for browser fallback
        if: ${{ steps.browser_preflight.outputs.browser_required == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Crawl attendance pages
        id: crawl_initial
        continue-on-error: true
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/attendance-crawl.mjs

      - name: Install Chromium after unexpected direct-API failure
        if: ${{ steps.crawl_initial.outcome == 'failure' && steps.browser_preflight.outputs.browser_required != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Retry crawl once after initial failure
        if: ${{ steps.crawl_initial.outcome == 'failure' }}
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output debug
          node scripts/attendance-crawl.mjs

      - name: Build canonical business report
        if: ${{ (env.ATTENDANCE_RUN_SLOT == 'morning_1230' || env.ATTENDANCE_RUN_SLOT == 'daily_2105') && hashFiles('output/attendance-*.json') != '' }}
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/build-report-payload.mjs

      - name: Encrypt result before artifact upload
        if: ${{ hashFiles('output/*.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p secure-bundle
          cp -R output secure-bundle/
          if [ -d debug ]; then
            cp -R debug secure-bundle/
          fi
          tar -C secure-bundle -czf attendance-payload.tgz .
          openssl rand -hex 32 > attendance-payload.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass file:attendance-payload.key \
            -in attendance-payload.tgz \
            -out attendance-payload.tgz.enc
          openssl pkeyutl -encrypt -pubin \
            -inkey .github/attendance-artifact-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in attendance-payload.key \
            -out attendance-payload.key.enc
          rm -rf secure-bundle output debug attendance-payload.tgz attendance-payload.key

      - name: Upload encrypted attendance artifact
        id: upload_artifact
        if: ${{ hashFiles('attendance-payload.tgz.enc') != '' && hashFiles('attendance-payload.key.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-encrypted-${{ github.run_id }}
          path: |
            attendance-payload.tgz.enc
            attendance-payload.key.enc
          retention-days: 3
          if-no-files-found: error

      - name: Publish non-sensitive production run state
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && steps.upload_artifact.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.upload_artifact.outputs['artifact-id'] }}
          ARTIFACT_NAME: attendance-encrypted-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state_path="$(node scripts/write-run-state.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$state_path"
          git commit -m "state: attendance ${ATTENDANCE_RUN_SLOT} ${TARGET_DATE} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
