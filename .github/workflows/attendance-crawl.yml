name: Attendance Crawl

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Vietnam attendance date (YYYY-MM-DD); blank = today"
        required: false
        type: string
      debug:
        description: "Capture raw text/screenshots inside the encrypted artifact"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub cron is UTC; Vietnam is UTC+7 year-round.
    # Queue early to absorb GitHub scheduler delay, then wait inside the job until the business snapshot time.
    - cron: "55 4 * * *"   # 11:55 VN queue -> snapshot at/after 12:15 for 12:30 morning report
    - cron: "30 13 * * *"  # 20:30 VN queue -> snapshot at/after 20:50 for 21:05 daily-summary report

permissions:
  contents: write

concurrency:
  group: attendance-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve attendance target date
        shell: bash
        env:
          MANUAL_TARGET_DATE: ${{ github.event.inputs.target_date }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TARGET_DATE:-}" ]; then
            target_date="$MANUAL_TARGET_DATE"
            run_slot="manual"
          else
            target_date="$(TZ=Asia/Ho_Chi_Minh date +%F)"
            case "${SCHEDULE_EXPRESSION:-}" in
              "55 4 * * *"|"15 5 * * *"|"25 5 * * *"|"30 5 * * *") run_slot="morning_1230" ;;
              "30 13 * * *"|"50 13 * * *"|"59 13 * * *"|"5 14 * * *") run_slot="daily_2105" ;;
              *) run_slot="manual_or_validation" ;;
            esac
          fi
          if ! [[ "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid resolved target date" >&2
            exit 1
          fi
          echo "TARGET_DATE=$target_date" >> "$GITHUB_ENV"
          echo "ATTENDANCE_RUN_SLOT=$run_slot" >> "$GITHUB_ENV"
          echo "Attendance run slot=$run_slot target_date=$target_date"

      - name: Wait until business snapshot time
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ATTENDANCE_RUN_SLOT" in
            morning_1230) snapshot_time="12:15:00" ;;
            daily_2105) snapshot_time="20:50:00" ;;
            *) echo "No wait target for slot=$ATTENDANCE_RUN_SLOT"; exit 0 ;;
          esac
          target_epoch="$(TZ=Asia/Ho_Chi_Minh date -d "${TARGET_DATE} ${snapshot_time}" +%s)"
          now_epoch="$(TZ=Asia/Ho_Chi_Minh date +%s)"
          if [ "$now_epoch" -lt "$target_epoch" ]; then
            wait_seconds=$((target_epoch - now_epoch))
            echo "Queued early for slot=$ATTENDANCE_RUN_SLOT; waiting ${wait_seconds}s until snapshot window."
            sleep "$wait_seconds"
          else
            echo "Scheduler started at/after snapshot window; proceeding immediately."
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run parser tests
        run: npm test

      - name: Validate private configuration
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATTENDANCE_ROSTER_JSON" || { echo "Missing required repository secret: ATTENDANCE_ROSTER_JSON"; exit 1; }
          fingerprint="$(node scripts/derive-artifact-material.mjs fingerprint)"
          test "${#fingerprint}" -eq 64 || { echo "Invalid roster fingerprint"; exit 1; }
          echo "ATTENDANCE_ROSTER_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Check whether browser fallback is required
        id: browser_preflight
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/browser-fallback-preflight.mjs

      - name: Install Chromium only for browser fallback
        if: ${{ steps.browser_preflight.outputs.browser_required == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Crawl attendance pages
        id: crawl_initial
        continue-on-error: true
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/attendance-crawl.mjs

      - name: Install Chromium after unexpected direct-API failure
        if: ${{ steps.crawl_initial.outcome == 'failure' && steps.browser_preflight.outputs.browser_required != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Retry crawl once after initial failure
        if: ${{ steps.crawl_initial.outcome == 'failure' }}
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output debug
          node scripts/attendance-crawl.mjs

      - name: Encrypt result before artifact upload
        if: ${{ hashFiles('output/*.json') != '' }}
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p secure-bundle
          cp -R output secure-bundle/
          if [ -d debug ]; then
            cp -R debug secure-bundle/
          fi
          tar -C secure-bundle -czf attendance-payload.tgz .
          node scripts/derive-artifact-material.mjs key | \
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass stdin \
              -in attendance-payload.tgz \
              -out attendance-payload.tgz.enc
          rm -rf secure-bundle output debug attendance-payload.tgz

      - name: Upload encrypted attendance artifact
        id: upload_artifact
        if: ${{ hashFiles('attendance-payload.tgz.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-encrypted-${{ github.run_id }}
          path: attendance-payload.tgz.enc
          retention-days: 3
          if-no-files-found: error

      - name: Publish non-sensitive scheduled run state
        if: ${{ github.event_name == 'schedule' && steps.upload_artifact.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.upload_artifact.outputs['artifact-id'] }}
          ARTIFACT_NAME: attendance-encrypted-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state_path="$(node scripts/write-run-state.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$state_path"
          git commit -m "state: attendance ${ATTENDANCE_RUN_SLOT} ${TARGET_DATE} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
