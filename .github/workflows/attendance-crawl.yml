name: Attendance Crawl

on:
  push:
    paths:
      - ".github/attendance-rerun-trigger.json"

permissions:
  contents: write

concurrency:
  group: attendance-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Ho_Chi_Minh
      DEBUG_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve scheduled attendance request
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/attendance-rerun-trigger.json || { echo "Missing attendance trigger" >&2; exit 1; }

          schema_version="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.schema_version ?? '')); ")"
          target_date="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.target_date||''));")"
          run_slot="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.slot||''));")"
          request_id="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.request_id||''));")"
          requested_at="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json','utf8')); process.stdout.write(String(x.requested_at||''));")"

          test "$schema_version" = "1" || { echo "Invalid trigger schema_version" >&2; exit 1; }
          case "$run_slot" in
            morning_1230|daily_2105) ;;
            *) echo "Invalid attendance slot" >&2; exit 1 ;;
          esac
          if ! [[ "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid target date" >&2
            exit 1
          fi
          if ! [[ "$request_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{5,127}$ ]]; then
            echo "Invalid attendance request_id" >&2
            exit 1
          fi
          node --input-type=module -e "const v=process.argv[1]; const t=Date.parse(v); if(!Number.isFinite(t)) process.exit(1);" "$requested_at" || {
            echo "Invalid attendance requested_at" >&2
            exit 1
          }

          echo "TARGET_DATE=$target_date" >> "$GITHUB_ENV"
          echo "ATTENDANCE_RUN_SLOT=$run_slot" >> "$GITHUB_ENV"
          echo "ATTENDANCE_REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "ATTENDANCE_REQUESTED_AT=$requested_at" >> "$GITHUB_ENV"
          echo "Attendance request accepted: slot=$run_slot target_date=$target_date request_id=$request_id"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run parser and report tests
        run: npm test

      - name: Validate private configuration
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATTENDANCE_ROSTER_JSON" || { echo "Missing required repository secret: ATTENDANCE_ROSTER_JSON"; exit 1; }
          roster_fingerprint="$(node scripts/derive-artifact-material.mjs fingerprint)"
          identity_fingerprint="$(node scripts/derive-artifact-material.mjs identity-fingerprint)"
          test "${#roster_fingerprint}" -eq 64 || { echo "Invalid roster fingerprint"; exit 1; }
          test "${#identity_fingerprint}" -eq 64 || { echo "Invalid identity fingerprint"; exit 1; }
          echo "ATTENDANCE_ROSTER_FINGERPRINT=$roster_fingerprint" >> "$GITHUB_ENV"
          echo "ATTENDANCE_IDENTITY_FINGERPRINT=$identity_fingerprint" >> "$GITHUB_ENV"

      - name: Check whether browser fallback is required
        id: browser_preflight
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/browser-fallback-preflight.mjs

      - name: Install Chromium only for browser fallback
        if: ${{ steps.browser_preflight.outputs.browser_required == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Crawl all attendance sources and wait for completion
        id: crawl_initial
        continue-on-error: true
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/attendance-crawl.mjs

      - name: Install Chromium after unexpected direct-API failure
        if: ${{ steps.crawl_initial.outcome == 'failure' && steps.browser_preflight.outputs.browser_required != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Retry crawl once after initial failure
        if: ${{ steps.crawl_initial.outcome == 'failure' }}
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output debug
          node scripts/attendance-crawl.mjs

      - name: Verify crawl completion barrier for all 8 employees
        id: crawl_barrier
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const roster = JSON.parse(process.env.ATTENDANCE_ROSTER_JSON || '[]');
          if (!Array.isArray(roster) || roster.length !== 8) {
            throw new Error('Completion barrier requires exactly 8 roster employees');
          }
          const expectedNames = roster.map((item) => String(item?.name || '').trim());
          if (expectedNames.some((name) => !name) || new Set(expectedNames).size !== 8) {
            throw new Error('Completion barrier roster names are invalid');
          }

          const targetDate = String(process.env.TARGET_DATE || '');
          const rawPath = `output/attendance-${targetDate}.json`;
          if (!fs.existsSync(rawPath)) throw new Error(`Missing crawler output: ${rawPath}`);
          const raw = JSON.parse(fs.readFileSync(rawPath, 'utf8'));
          if (raw?.schema_version !== 5 || raw?.date !== targetDate || raw?.timezone !== 'Asia/Ho_Chi_Minh') {
            throw new Error('Crawler output identity does not match the requested run');
          }
          if (!Array.isArray(raw?.employees) || raw.employees.length !== 8) {
            throw new Error('Crawler did not return exactly 8 employee results');
          }

          const terminalStatuses = new Set(['complete', 'incomplete', 'review_required', 'date_not_found', 'technical_error']);
          raw.employees.forEach((employee, index) => {
            if (employee?.name !== expectedNames[index]) {
              throw new Error(`Crawler employee order/name mismatch at position ${index + 1}`);
            }
            if (!terminalStatuses.has(String(employee?.status || ''))) {
              throw new Error(`Crawler result for ${expectedNames[index]} is not terminal`);
            }
          });

          const generatedAtMs = Date.parse(String(raw.generated_at || ''));
          if (!Number.isFinite(generatedAtMs)) throw new Error('Crawler generated_at is invalid');
          const requestedAtMs = Date.parse(String(process.env.ATTENDANCE_REQUESTED_AT || ''));
          if (!Number.isFinite(requestedAtMs)) throw new Error('Request requested_at is invalid');
          if (generatedAtMs + 1000 < requestedAtMs) {
            throw new Error('Crawler output predates the current attendance request');
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `ATTENDANCE_CRAWL_COMPLETED_AT=${raw.generated_at}\nATTENDANCE_CRAWL_EMPLOYEE_COUNT=8\n`);
          console.log(`Crawl completion barrier passed: request_id=${process.env.ATTENDANCE_REQUEST_ID} employees=8 generated_at=${raw.generated_at}`);
          NODE

      - name: Build canonical business report after crawl barrier
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/build-report-payload.mjs

      - name: Encrypt result before artifact upload
        if: ${{ hashFiles('output/*.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p secure-bundle
          cp -R output secure-bundle/
          if [ -d debug ]; then
            cp -R debug secure-bundle/
          fi
          tar -C secure-bundle -czf attendance-payload.tgz .
          openssl rand -hex 32 > attendance-payload.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass file:attendance-payload.key \
            -in attendance-payload.tgz \
            -out attendance-payload.tgz.enc
          openssl pkeyutl -encrypt -pubin \
            -inkey .github/attendance-artifact-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in attendance-payload.key \
            -out attendance-payload.key.enc
          rm -rf secure-bundle output debug attendance-payload.tgz attendance-payload.key

      - name: Upload encrypted attendance artifact
        id: upload_artifact
        if: ${{ hashFiles('attendance-payload.tgz.enc') != '' && hashFiles('attendance-payload.key.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attendance-encrypted-${{ github.run_id }}
          path: |
            attendance-payload.tgz.enc
            attendance-payload.key.enc
          retention-days: 3
          if-no-files-found: error

      - name: Publish request-correlated production run state
        if: ${{ steps.upload_artifact.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.upload_artifact.outputs['artifact-id'] }}
          ARTIFACT_NAME: attendance-encrypted-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state_path="$(node scripts/write-run-state.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$state_path"
          git commit -m "state: attendance ${ATTENDANCE_RUN_SLOT} ${TARGET_DATE} ${ATTENDANCE_REQUEST_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
