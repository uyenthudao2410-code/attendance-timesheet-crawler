name: Attendance Producer Watchdog

on:
  schedule:
    # Three fail-closed recovery checks between producer and V24 Teams publication.
    # Keep off the top of each hour to reduce GitHub scheduler congestion.
    - cron: "12 6 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "30 6 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "42 6 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "12 13 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "30 13 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "42 13 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write
  actions: write

concurrency:
  group: attendance-producer-watchdog
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
      GH_TOKEN: ${{ github.token }}
      WATCHDOG_CRON: ${{ github.event.schedule }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify producer state and self-heal once if needed
        shell: bash
        run: |
          set -euo pipefail

          case "$WATCHDOG_CRON" in
            "12 6 * * *"|"30 6 * * *"|"42 6 * * *")
              slot="daily_2105"
              target_date="$(TZ=Asia/Ho_Chi_Minh date -d 'yesterday' +%F)"
              ;;
            "12 13 * * *"|"30 13 * * *"|"42 13 * * *")
              slot="morning_1230"
              target_date="$(TZ=Asia/Ho_Chi_Minh date +%F)"
              ;;
            *)
              echo "Unsupported watchdog schedule: $WATCHDOG_CRON" >&2
              exit 1
              ;;
          esac

          receipt_path=".github/attendance-publications/${slot}-${target_date}.json"
          receipt_state="$(RECEIPT_PATH="$receipt_path" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let state = 'missing';
          try {
            const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'));
            if (receipt?.status === 'sent') {
              state = /^\d+$/.test(String(receipt?.message_id || '')) ? 'sent' : 'uncertain';
            } else if (['sending','uncertain'].includes(String(receipt?.status || ''))) {
              state = receipt.status;
            } else if (receipt?.status) {
              state = String(receipt.status);
            }
          } catch {}
          process.stdout.write(state);
          NODE
          )"

          if [ "$receipt_state" = "sent" ]; then
            echo "WATCHDOG_STATE=publication_receipt_sent slot=$slot target_date=$target_date"
            exit 0
          fi
          if [ "$receipt_state" = "sending" ] || [ "$receipt_state" = "uncertain" ]; then
            echo "WATCHDOG_STATE=delivery_uncertain_fail_closed slot=$slot target_date=$target_date receipt_status=$receipt_state" >&2
            exit 1
          fi

          # V24's authoritative state is its Teams publication receipt, not legacy AI producer state.
          # A live crawl run may be waiting until the exact Teams publication minute.
          pending="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/attendance-crawl.yml/runs?per_page=40" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "${pending:-0}" -gt 0 ]; then
            echo "WATCHDOG_STATE=producer_pending count=$pending slot=$slot target_date=$target_date"
            exit 0
          fi

          same_request="$(SLOT="$slot" TARGET_DATE="$target_date" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let same = false;
          try {
            const trigger = JSON.parse(fs.readFileSync('.github/attendance-rerun-trigger.json', 'utf8'));
            const id = String(trigger?.request_id || '');
            same = trigger?.schema_version === 1
              && trigger?.slot === process.env.SLOT
              && trigger?.target_date === process.env.TARGET_DATE
              && trigger?.delivery?.enabled === false
              && /^(?:watchdog-|self-heal-)/.test(id);
          } catch {}
          process.stdout.write(same ? 'yes' : 'no');
          NODE
          )"

          if [ "$same_request" = "yes" ]; then
            echo "WATCHDOG_STATE=self_heal_already_requested slot=$slot target_date=$target_date"
            exit 0
          fi

          request_id="watchdog-${slot}-${target_date}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          requested_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          REQUEST_ID="$request_id" SLOT="$slot" TARGET_DATE="$target_date" REQUESTED_AT="$requested_at"           node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const trigger = {
            schema_version: 1,
            request_id: process.env.REQUEST_ID,
            slot: process.env.SLOT,
            target_date: process.env.TARGET_DATE,
            requested_at: process.env.REQUESTED_AT,
            reason: 'automatic watchdog self-heal for stale or missing producer state',
            delivery: { enabled: false },
          };
          fs.writeFileSync('.github/attendance-rerun-trigger.json', JSON.stringify(trigger, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/attendance-rerun-trigger.json
          git commit -m "self-heal: attendance ${slot} ${target_date}"
          git pull --rebase origin main
          git push origin HEAD:main

          # GITHUB_TOKEN-authored pushes do not recursively start push workflows,
          # so dispatch Attendance Crawl explicitly after the audited trigger commit.
          gh api --method POST             "/repos/${GITHUB_REPOSITORY}/actions/workflows/attendance-crawl.yml/dispatches"             -f ref=main

          echo "WATCHDOG_STATE=self_heal_dispatched slot=$slot target_date=$target_date request_id=$request_id"
