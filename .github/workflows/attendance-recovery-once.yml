name: Attendance Recovery Once

on:
  push:
    paths:
      - ".github/attendance-recovery-trigger.txt"

permissions:
  contents: write

concurrency:
  group: attendance-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Ho_Chi_Minh
      TARGET_DATE: "2026-08-23"
      DEBUG_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Crawl exact attendance date
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/attendance-crawl.mjs

      - name: Encrypt recovery JSON to one-time certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "output/attendance-${TARGET_DATE}.json"
          openssl cms -encrypt -binary -aes256 \
            -in "output/attendance-${TARGET_DATE}.json" \
            -outform DER \
            -out attendance-recovery.cms \
            .github/attendance-recovery-public.crt
          rm -rf output debug

      - name: Upload encrypted recovery artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: attendance-recovery-${{ github.run_id }}
          path: attendance-recovery.cms
          retention-days: 1
          if-no-files-found: error

      - name: Publish recovery routing state
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/attendance-state
          cat > .github/attendance-state/recovery_2026-08-23.json <<EOF
          {
            "schema_version": 1,
            "target_date": "2026-08-23",
            "run_id": "${GITHUB_RUN_ID}",
            "artifact_id": "${ARTIFACT_ID}",
            "artifact_name": "attendance-recovery-${GITHUB_RUN_ID}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/attendance-state/recovery_2026-08-23.json
          git commit -m "state: attendance recovery 2026-08-23 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
