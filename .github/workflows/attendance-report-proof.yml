name: Attendance Report Proof

on:
  push:
    paths:
      - ".github/attendance-report-proof-trigger"

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      DEBUG_MODE: false
      ATTENDANCE_RUN_SLOT: morning_1230

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve proof date
        shell: bash
        run: echo "TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Preflight all eight GitHub roster entries
        id: browser_preflight
        if: ${{ steps.tests.outcome == 'success' }}
        continue-on-error: true
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/browser-fallback-preflight.mjs

      - name: Install Chromium when required
        if: ${{ steps.browser_preflight.outcome == 'success' && steps.browser_preflight.outputs.browser_required == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Crawl current attendance from GitHub
        id: crawl
        if: ${{ steps.tests.outcome == 'success' && steps.browser_preflight.outcome == 'success' }}
        continue-on-error: true
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/attendance-crawl.mjs

      - name: Build GitHub-owned business report
        id: build
        if: ${{ steps.crawl.outcome == 'success' }}
        continue-on-error: true
        env:
          ATTENDANCE_ROSTER_JSON: ${{ secrets.ATTENDANCE_ROSTER_JSON }}
        run: node scripts/build-report-payload.mjs

      - name: Validate report-ready contract
        id: validate
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = `output/report-${process.env.ATTENDANCE_RUN_SLOT}-${process.env.TARGET_DATE}.json`;
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (report.schema_version !== 1) throw new Error('report schema mismatch');
          if (report.kind !== 'attendance_business_report') throw new Error('report kind mismatch');
          if (report.slot !== process.env.ATTENDANCE_RUN_SLOT) throw new Error('report slot mismatch');
          if (report.date !== process.env.TARGET_DATE) throw new Error('report date mismatch');
          if (report.timezone !== 'Asia/Ho_Chi_Minh') throw new Error('report timezone mismatch');
          if (report.employee_count !== 8 || report.employees?.length !== 8) throw new Error('report must account for exactly 8 employees');
          if (typeof report.teams_html !== 'string' || !report.teams_html.includes('BÁO CÁO CHẤM CÔNG CA SÁNG')) throw new Error('teams_html missing');
          console.log(`REPORT_PROOF=PASS employees=${report.employee_count}`);
          NODE

      - name: Prepare proof receipt
        if: ${{ always() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.browser_preflight.outcome }}
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const outcomes = {
            tests: process.env.TESTS_OUTCOME || 'skipped',
            preflight: process.env.PREFLIGHT_OUTCOME || 'skipped',
            crawl: process.env.CRAWL_OUTCOME || 'skipped',
            build: process.env.BUILD_OUTCOME || 'skipped',
            validate: process.env.VALIDATE_OUTCOME || 'skipped',
          };
          const pass = Object.values(outcomes).every((value) => value === 'success');
          const file = `output/report-${process.env.ATTENDANCE_RUN_SLOT}-${process.env.TARGET_DATE}.json`;
          let report = null;
          let reportSha256 = null;
          if (fs.existsSync(file)) {
            const bytes = fs.readFileSync(file);
            report = JSON.parse(bytes.toString('utf8'));
            reportSha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          }
          const receipt = {
            schema_version: 1,
            status: pass ? 'PASS' : 'FAIL',
            date: process.env.TARGET_DATE,
            slot: process.env.ATTENDANCE_RUN_SLOT,
            employee_count: report?.employee_count ?? null,
            technical_error_count: report?.quality?.technical_error_count ?? null,
            review_required_count: report?.quality?.review_required_count ?? null,
            open_session_count: report?.quality?.open_session_count ?? null,
            report_sha256: reportSha256,
            outcomes,
            source_head_sha: process.env.GITHUB_SHA,
            generated_at: new Date().toISOString(),
          };
          fs.writeFileSync('.github/attendance-report-proof-result.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(`REPORT_PROOF_RECEIPT=${receipt.status}`);
          NODE

      - name: Publish proof receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/attendance-report-proof-result.json
          git commit -m "test: attendance report proof receipt [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
