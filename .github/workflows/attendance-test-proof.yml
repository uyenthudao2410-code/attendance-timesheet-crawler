name: Attendance Test Proof

on:
  push:
    paths:
      - ".github/attendance-test-trigger"

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Run tests
        id: tests
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm test

      - name: Prepare receipt
        if: ${{ always() }}
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status=PASS
          if [ "$INSTALL_OUTCOME" != "success" ] || [ "$TEST_OUTCOME" != "success" ]; then status=FAIL; fi
          cat > .github/attendance-test-proof-result.json <<EOF
          {
            "status": "$status",
            "source_head_sha": "$GITHUB_SHA",
            "install_outcome": "$INSTALL_OUTCOME",
            "test_outcome": "$TEST_OUTCOME",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Publish receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/attendance-test-proof-result.json
          git commit -m "test: attendance proof receipt [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
